[project]
name = "forest-bot"
version = "0.1.0"
description = "Telegram bot that answers forest residents' questions from the «Лісовий архів» documents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram>=3.13,<4",
    "asyncpg>=0.30,<1",
    "pgvector>=0.3,<1",
    "groq>=0.11,<1",
    "pydantic-settings>=2.5,<3",
    "fastembed>=0.4,<1",
    "pypdf>=5,<7",
    "pypdfium2>=4.30,<6",
    "pytesseract>=0.3.13,<1",
    "pillow>=10.4,<12",
    "python-docx>=1.1,<2",
    "numpy>=1.26,<3",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<2",
    "pytest-mock>=3.14,<4",
    "ruff>=0.7,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forest_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["db: needs a running Postgres (DATABASE_URL)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]
