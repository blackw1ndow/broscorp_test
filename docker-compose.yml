services:
  db:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_DB: forest
      POSTGRES_USER: forest
      POSTGRES_PASSWORD: forest
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forest -d forest"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  bot:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://forest:forest@db:5432/forest
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
